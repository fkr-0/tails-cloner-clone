  install.not_running_live_iso_usb:
    group: install
    title: Cloner launched with not-running Tails live USB as source
    desired_flow: any launcher system -> select attached non-running Tails USB/source -> install to target
    current_status: implemented
    current_coverage:
    - Vagrant fixture creates source_disk labeled TAILS_SRC
    - source_disk contains live/Tails.version to model a not-running Tails live USB source
    - dry-run-source-device-install validates source and target are distinct block devices
    - dry-run-source-device-install prints a whole-source-device to whole-target-device dd plan without writing
    - optional destructive-source-device-install-validate copies source_disk to target_extra_disk when explicitly gated
    - post-write validation checks copied TAILS_SRC label and live/Tails.version on target
    default_e2e: true
    command: sudo TAILS_CLONER_LAB_ALLOW_DESTRUCTIVE=1 PYTHONPATH=src python3 infra/vagrant-lab/scripts/run_lab_scenario.py
      destructive-source-device-install-validate --target extra
    next_step: keep as optional destructive source-device install e2e; prefer running the dry-run by default and this validation
      in full lab runs
    verified:
      date: '2026-05-20'
      environment: vagrant controller
      command: sudo TAILS_CLONER_LAB_ALLOW_DESTRUCTIVE=1 PYTHONPATH=src python3 infra/vagrant-lab/scripts/run_lab_scenario.py
        destructive-source-device-install-validate --target extra
      result: copy command exceeded outer timeout, but post-write validation passed; target_extra_disk copied TAILS_SRC label
        and live/Tails.version from source_disk
      source_disk: /dev/sdb
      source_partition: /dev/sdb1
      target_disk: /dev/sde
      target_partition: /dev/sde1
      target_label: TAILS_SRC
      target_live_version: 7.7.2-fixture-source
