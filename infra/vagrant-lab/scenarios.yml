  upgrade.any_linux.source_running_live_iso_usb:
    group: upgrade_with_persistence
    title: Any Linux upgrades existing Tails using running live USB as source
    desired_flow: Linux host -> source is running/attached live Tails USB -> upgrade target preserving persistence
    persistence_required: true
    current_status: implemented
    current_coverage:
    - source.py now has AttachedLiveSystemSource to represent a mounted live medium separate from the launcher OS
    - AttachedLiveSystemSource validates live/Tails.version and exposes the source parent disk
    - AttachedLiveSystemSource.target_is_source_device prevents selecting the source disk or partitions as target
    - unit tests cover version validation, invalid source paths, and parent-disk target exclusion
    - upgrader.py now has upgrade_tails_system_partition_from_device for attached live source devices
    - source-device upgrade backend is partition-scoped and does not use whole-device clone
    - unit tests prove source-device upgrade copies source vfat partition to target vfat partition and preserves target persistence
    - controller.py can validate and record an attached live source selection
    - controller.py exposes target_is_attached_live_source for parent-disk target exclusion
    - AppState stores attached live source device, mount, and version fields
    - tests/test_controller.py covers attached source set, clear, and target exclusion behavior
    - run_lab_scenario.py now exposes simulate-source-device-upgrade-preserve-persistence
    - source-device lab scenario uses source_disk as attached live source and target_upgrade_disk as persistent target
    - source-device lab scenario verifies persistence marker digest before and after upgrade
    - future disk fixture source partition is size-compatible with target upgrade system partition
    - SourceMode.ATTACHED routes upgrade_selected_image through source-device upgrade service
    - attached live sources are rejected for install/reinstall to avoid undefined whole-device install semantics
    - controller tests prove attached-source upgrades use upgrade_from_device and never image-based upgrade
    - app.py exposes an Attached live source radio option with source device, mount point, and validation button
    - app.py validates attached live source through ApplicationController.set_attached_live_source
    - app.py forces attached live source workflows into Upgrade mode
    - app.py excludes the attached source disk and partitions from target choices
    - app.py confirmation text describes attached live source without requiring a local image path
    - run_lab_scenario.py exposes non-destructive preflight-source-device-upgrade-preserve-persistence
    - preflight validates source live USB fixture, target persistence marker, source/target partition size compatibility,
      and partition-scoped dd plan
    default_e2e: false
    next_step: keep as optional destructive e2e; remaining real-boot variants are tracked by E2E-004 and E2E-005
    command: sudo TAILS_CLONER_LAB_ALLOW_DESTRUCTIVE=1 PYTHONPATH=src python3 infra/vagrant-lab/scripts/run_lab_scenario.py
      simulate-source-device-upgrade-preserve-persistence
    preflight_command: PYTHONPATH=src python3 infra/vagrant-lab/scripts/run_lab_scenario.py preflight-source-device-upgrade-preserve-persistence
